name: CI

on:
  push:
    branches: [master]
    paths: ['Backend/**', '.github/workflows/**']
  pull_request:
    paths: ['Backend/**', '.github/workflows/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # *ApplicationTests (contextLoads) need real Postgres/RabbitMQ, so only unit tests run here
      - run: ./mvnw -B -ntp verify -Dtest='!*ApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

  # Build each service image once and push to GHCR; CD only pulls. Skipped on PRs.
  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # services depending on common-lib build with Backend/ as context
          - {service: api-gateway, context: Backend/api-gateway, file: Backend/api-gateway/Dockerfile}
          - {service: user-service, context: Backend, file: Backend/user-service/Dockerfile}
          - {service: project-service, context: Backend, file: Backend/project-service/Dockerfile}
          - {service: task-service, context: Backend, file: Backend/task-service/Dockerfile}
          - {service: sprint-service, context: Backend, file: Backend/sprint-service/Dockerfile}
          - {service: notification-service, context: Backend, file: Backend/notification-service/Dockerfile}
          - {service: dashboard-service, context: Backend/dashboard-service, file: Backend/dashboard-service/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taskmgmt-${{ matrix.service }}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }},${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
