<header class="header">
  <div class="header-left">
    <button mat-icon-button class="menu-toggle" (click)="onMenuToggle()" aria-label="Toggle menu">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="logo">
      <mat-icon class="logo-icon">task_alt</mat-icon>
      <span class="logo-text">Task Management</span>
    </div>
  </div>

  <div class="header-right">
    @if (currentUser()) {
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">
        <div class="user-avatar">
          {{ currentUser()!.name.charAt(0).toUpperCase() }}
        </div>
      </button>

      <mat-menu #userMenu="matMenu" class="user-menu">
        <div class="user-menu-header">
          <div class="user-avatar large">
            {{ currentUser()!.name.charAt(0).toUpperCase() }}
          </div>
          <div class="user-info">
            <span class="user-name">{{ currentUser()!.name }}</span>
            <span class="user-email">{{ currentUser()!.email }}</span>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onLogout()" class="logout-button">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    }
  </div>
</header>
