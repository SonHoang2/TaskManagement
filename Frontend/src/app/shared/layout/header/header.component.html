<header class="header">
  <div class="header-left">
    <button mat-icon-button class="menu-toggle" (click)="onMenuToggle()" aria-label="Toggle menu">
      <mat-icon>menu</mat-icon>
    </button>
    <button
      mat-icon-button
      class="sidebar-toggle"
      (click)="onSidebarToggle()"
      aria-label="Toggle sidebar"
    >
      <mat-icon>
        @if (isSidebarOpen()) {
          chevron_left
        } @else {
          menu
        }
      </mat-icon>
    </button>
    <div class="logo">
      <mat-icon class="logo-icon">task_alt</mat-icon>
      <span class="logo-text">Task Management</span>
    </div>
  </div>

  <div class="header-center">
    <div class="search-bar">
      <mat-icon class="search-icon">search</mat-icon>
      <input type="text" placeholder="Search tasks, projects..." class="search-input" />
    </div>
  </div>

  <div class="header-right">
    <button mat-stroked-button class="create-button">
      <mat-icon>add</mat-icon>
      <span>Create</span>
    </button>

    <button mat-icon-button class="icon-button" aria-label="Notifications">
      <mat-icon>notifications</mat-icon>
    </button>

    <button mat-icon-button class="icon-button" aria-label="Help">
      <mat-icon>help_outline</mat-icon>
    </button>

    <button mat-icon-button class="icon-button" routerLink="/settings" aria-label="Settings">
      <mat-icon>settings</mat-icon>
    </button>

    @if (currentUser()) {
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">
        @if (currentUser()!.avatarUrl) {
          <div class="user-avatar user-avatar-image">
            <img [ngSrc]="currentUser()!.avatarUrl!" alt="User avatar" priority />
          </div>
        } @else {
          <div class="user-avatar">
            {{ userInitials() }}
          </div>
        }
      </button>

      <mat-menu #userMenu="matMenu" class="user-menu" xPosition="before">
        <div class="user-menu-header">
          @if (currentUser()!.avatarUrl) {
            <div class="user-avatar large user-avatar-image">
              <img [ngSrc]="currentUser()!.avatarUrl!" alt="User avatar" priority />
            </div>
          } @else {
            <div class="user-avatar large">
              {{ userInitials() }}
            </div>
          }
          <div class="user-info">
            <span class="user-name">{{ currentUser()!.name }}</span>
            <span class="user-email">{{ currentUser()!.email }}</span>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item routerLink="/settings/account">
          <mat-icon>account_circle</mat-icon>
          <span>Account settings</span>
        </button>
        <button mat-menu-item>
          <mat-icon>palette</mat-icon>
          <span>Theme</span>
        </button>
        <button mat-menu-item>
          <mat-icon>swap_horiz</mat-icon>
          <span>Switch account</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onLogout()" class="logout-button">
          <mat-icon>logout</mat-icon>
          <span>Log out</span>
        </button>
      </mat-menu>
    }
  </div>
</header>
