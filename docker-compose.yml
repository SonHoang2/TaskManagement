version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G
        reservations:
          cpus: "0.25"
          memory: 512M
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 256M

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE}
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256M

  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=${EUREKA_INSTANCE_PREFER_IP_ADDRESS}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    depends_on:
      - rabbitmq
    logging:
      driver: "json-file"
      options:
        labels: "service"
    labels:
      service: "service-registry"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8765:8765"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - JWT_SECRET=${JWT_SECRET}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - service-registry
      - rabbitmq
      - postgres
    logging:
      driver: "json-file"
      options:
        labels: "service"
    labels:
      service: "api-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_NAME=${USER_DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - service-registry
      - rabbitmq
      - postgres
    logging:
      driver: "json-file"
      options:
        labels: "service"
    labels:
      service: "user-service"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  task-service:
    build: ./task-service
    container_name: task-service
    ports:
      - "5003:5003"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_NAME=${TASK_DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - service-registry
      - rabbitmq
      - postgres
    logging:
      driver: "json-file"
      options:
        labels: "service"
    labels:
      service: "task-service"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  project-service:
    build: ./project-service
    container_name: project-service
    ports:
      - "5002:5002"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_NAME=${PROJECT_DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - service-registry
      - rabbitmq
      - postgres
    logging:
      driver: "json-file"
      options:
        labels: "service"
    labels:
      service: "project-service"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  sprint-service:
    build: ./sprint-service
    container_name: sprint-service
    ports:
      - "5004:5004"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_NAME=${SPRINT_DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - service-registry
      - rabbitmq
      - postgres
    logging:
      driver: "json-file"
      options:
        labels: "service"
    labels:
      service: "sprint-service"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "5005:5005"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_NAME=${NOTIFICATION_DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - service-registry
      - rabbitmq
      - postgres
    logging:
      driver: "json-file"
      options:
        labels: "service"
    labels:
      service: "notification-service"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  dashboard-service:
    build: ./dashboard-service
    container_name: dashboard-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - service-registry
      - rabbitmq
    logging:
      driver: "json-file"
      options:
        labels: "service"
    labels:
      service: "dashboard-service"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  rabbitmq_data:
  postgres_data:
