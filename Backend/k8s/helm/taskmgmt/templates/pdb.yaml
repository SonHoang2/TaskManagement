{{- range $name, $svc := .Values.services }}
{{- if $svc.pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "taskmgmt.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: {{ $name }}}}
{{- end }}
{{- end }}
