apiVersion: v1
kind: Namespace
metadata:
  name: taskmgmt
---
# Non-secret config shared by all apps. Service discovery = k8s Service DNS (port 80 -> container port).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: taskmgmt
data:
  SPRING_PROFILES_ACTIVE: docker
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4200
  LOGGING_LEVEL_SPRING_SECURITY: INFO
  LOGGING_LEVEL_SPRING_WEB: INFO
  # gateway routes (/<service>/** -> service)
  USER_SERVICE_URL: http://user-service
  PROJECT_SERVICE_URL: http://project-service
  TASK_SERVICE_URL: http://task-service
  SPRINT_SERVICE_URL: http://sprint-service
  NOTIFICATION_SERVICE_URL: http://notification-service
  DASHBOARD_SERVICE_URL: http://dashboard-service
  # keep JVMs small: one node runs everything
  JAVA_TOOL_OPTIONS: -XX:+UseSerialGC -Xms64m -Xmx256m -XX:TieredStopAtLevel=1 -XX:CICompilerCount=2 -Xss512k
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
  # actuator health probes (liveness/readiness) + graceful shutdown on SIGTERM
  # actuator runs on its own port (9090): not served by the app's security chain, not routed by
  # Service/Ingress, so /actuator/prometheus is reachable only from inside the cluster (Prometheus scrapes pod IPs)
  MANAGEMENT_SERVER_PORT: "9090"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
  # a few fixed _bucket series (not ~70 per URI) so Prometheus can histogram_quantile p95/p99 cheaply; 1s matches the latency alert
  MANAGEMENT_METRICS_DISTRIBUTION_SLO_HTTP_SERVER_REQUESTS: 50ms,100ms,250ms,500ms,1s,2500ms,5s
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 25s
