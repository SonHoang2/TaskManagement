# Metrics stack: Prometheus (scrape + rules) -> Alertmanager (routing), Grafana (dashboards).
# Rules, Alertmanager config and the dashboard come from ../observability/ via deploy-observability.sh
# (ConfigMaps prometheus-rules, alertmanager-config, grafana-dashboards); apply this file after running it.
# UIs are cluster-internal: kubectl port-forward -n taskmgmt svc/grafana 3000:80 (see README).
---
# Prometheus only needs to list pods in its own namespace, so a Role (not a ClusterRole) is enough.
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: taskmgmt}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus, namespace: taskmgmt}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: taskmgmt}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects:
- {kind: ServiceAccount, name: prometheus, namespace: taskmgmt}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: taskmgmt}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: alertmanager
        static_configs:
          - targets: ['alertmanager:9093']
      # Discover pods in this namespace that opt in with the prometheus.io/* annotations (see apps.yaml).
      # Scraping pod IPs directly (not the Service) gives one series per replica, which HPA needs.
      - job_name: taskmgmt-apps
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [taskmgmt]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data, namespace: taskmgmt}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: taskmgmt}
spec:
  replicas: 1
  strategy: {type: Recreate}   # RWO volume: the old pod must release it first
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsUser: 65534, runAsNonRoot: true, fsGroup: 65534}
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --storage.tsdb.retention.size=1GB
        - --web.enable-lifecycle
        ports:
        - containerPort: 9090
        readinessProbe:
          httpGet: {path: /-/ready, port: 9090}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /-/healthy, port: 9090}
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
        - {name: rules, mountPath: /etc/prometheus/rules}
        - {name: data, mountPath: /prometheus}
        resources:
          requests: {cpu: 100m, memory: 192Mi}
          limits: {cpu: 500m, memory: 512Mi}
      volumes:
      - {name: config, configMap: {name: prometheus-config}}
      - {name: rules, configMap: {name: prometheus-rules}}
      - {name: data, persistentVolumeClaim: {claimName: prometheus-data}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: taskmgmt}
spec:
  selector: {app: prometheus}
  ports:
  - {port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alertmanager, namespace: taskmgmt}
spec:
  replicas: 1
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
    spec:
      securityContext: {runAsUser: 65534, runAsNonRoot: true}
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        ports:
        - containerPort: 9093
        readinessProbe:
          httpGet: {path: /-/ready, port: 9093}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /-/healthy, port: 9093}
          periodSeconds: 20
        volumeMounts:
        - {name: config, mountPath: /etc/alertmanager}
        - {name: data, mountPath: /alertmanager}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
      volumes:
      - {name: config, configMap: {name: alertmanager-config}}
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager, namespace: taskmgmt}
spec:
  selector: {app: alertmanager}
  ports:
  - {port: 9093, targetPort: 9093}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: taskmgmt}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData: {timeInterval: 15s}
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: taskmgmt
        folder: TaskManagement
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: taskmgmt}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext: {runAsUser: 472, runAsNonRoot: true, fsGroup: 472}
      containers:
      - name: grafana
        image: grafana/grafana:10.4.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        # optional: `kubectl create secret generic grafana-admin -n taskmgmt --from-literal=password=...`
        # without it Grafana starts with admin/admin and asks to change it on first login
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom: {secretKeyRef: {name: grafana-admin, key: password, optional: true}}
        readinessProbe:
          httpGet: {path: /api/health, port: 3000}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /api/health, port: 3000}
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml}
        - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
        - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
        - {name: data, mountPath: /var/lib/grafana}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 300m, memory: 256Mi}
      volumes:
      - {name: provisioning, configMap: {name: grafana-provisioning}}
      - {name: dashboards, configMap: {name: grafana-dashboards}}
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: taskmgmt}
spec:
  selector: {app: grafana}
  ports:
  - {port: 80, targetPort: 3000}
