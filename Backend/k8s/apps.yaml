---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: taskmgmt
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
      - name: api-gateway
        image: taskmgmt/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8765
        envFrom:
        - configMapRef: {name: app-config}
        env:
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: app-secrets, key: JWT_SECRET}}
        startupProbe:
          tcpSocket: {port: 8765}
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket: {port: 8765}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: 8765}
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 450Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: taskmgmt
spec:
  selector: {app: api-gateway}
  ports:
  - port: 80
    targetPort: 8765
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: taskmgmt
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels: {app: user-service}
  template:
    metadata:
      labels: {app: user-service}
    spec:
      containers:
      - name: user-service
        image: taskmgmt/user-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        envFrom:
        - configMapRef: {name: app-config}
        env:
        - name: DB_NAME
          value: user_db
        - name: DB_USERNAME
          valueFrom: {secretKeyRef: {name: app-secrets, key: DB_USERNAME}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: app-secrets, key: DB_PASSWORD}}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: app-secrets, key: JWT_SECRET}}
        startupProbe:
          tcpSocket: {port: 5001}
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket: {port: 5001}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: 5001}
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 450Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: taskmgmt
spec:
  selector: {app: user-service}
  ports:
  - port: 80
    targetPort: 5001
