spring.application.name=api-gateway
server.port=8765

# Static routes: /<service>/** -> http://<service> (k8s Service DNS; override via env for local runs)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://user-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].id=project-service
spring.cloud.gateway.routes[1].uri=${PROJECT_SERVICE_URL:http://project-service}
spring.cloud.gateway.routes[1].predicates[0]=Path=/project-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].id=task-service
spring.cloud.gateway.routes[2].uri=${TASK_SERVICE_URL:http://task-service}
spring.cloud.gateway.routes[2].predicates[0]=Path=/task-service/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[3].id=sprint-service
spring.cloud.gateway.routes[3].uri=${SPRINT_SERVICE_URL:http://sprint-service}
spring.cloud.gateway.routes[3].predicates[0]=Path=/sprint-service/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://notification-service}
spring.cloud.gateway.routes[4].predicates[0]=Path=/notification-service/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[5].id=dashboard-service
spring.cloud.gateway.routes[5].uri=${DASHBOARD_SERVICE_URL:http://dashboard-service}
spring.cloud.gateway.routes[5].predicates[0]=Path=/dashboard-service/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.default-filters[0].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.default-filters[0].args.rate-limiter=#{@redisRateLimiter}

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

spring.profiles.active=local

# Service URLs for dashboard aggregation
services.project-service.url=http://project-service
services.task-service.url=http://task-service
services.user-service.url=http://user-service
services.sprint-service.url=http://sprint-service

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# CORS allowed origins (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}