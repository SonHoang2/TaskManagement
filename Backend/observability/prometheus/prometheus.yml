# Prometheus config for docker-compose. (On k8s the scrape config lives in k8s/observability.yaml.)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # Every Spring Boot service exposes /actuator/prometheus on management port 9090.
  # The `service` label is what dashboards/alerts group by (k8s sets it from the pod's `app` label).
  - job_name: taskmgmt-apps
    metrics_path: /actuator/prometheus
    static_configs:
      - {targets: ['api-gateway:9090'], labels: {service: api-gateway}}
      - {targets: ['user-service:9090'], labels: {service: user-service}}
      - {targets: ['project-service:9090'], labels: {service: project-service}}
      - {targets: ['task-service:9090'], labels: {service: task-service}}
      - {targets: ['sprint-service:9090'], labels: {service: sprint-service}}
      - {targets: ['notification-service:9090'], labels: {service: notification-service}}
      - {targets: ['dashboard-service:9090'], labels: {service: dashboard-service}}
