# docker-compose only. (k8s: inline in k8s/observability.yaml; Loki is not deployed there yet.)
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData: {timeInterval: 15s}
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
