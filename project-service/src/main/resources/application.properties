spring.application.name=project-service
server.port=5002
spring.datasource.url=jdbc:postgresql://localhost:5432/project_db
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.expiration=86400000

spring.profiles.active=local
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Eureka client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ exchange and queue configuration
app.rabbitmq.exchange=task.events
app.rabbitmq.queue.project-invitation-created=project.invitation.created.queue
app.rabbitmq.routing-key.project-invitation-created=project.invitation.created