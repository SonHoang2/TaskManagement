$kind: http-request
name: login
url: "{{url}}/user-service/api/v1/auth/login"
method: POST
queryParams:
  - key: size
    value: "10"
    disabled: true
  - key: sort
    value: id,asc
    disabled: true
  - key: status
    value: IN_PROGRESS
    disabled: true
  - key: keyword
    value: keyword
    disabled: true
body:
  type: json
  content: "{\r

    \  \"email\": \"son@example.com\",\r

    \  \"password\": \"secret123\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      // Parse response JSON
      const res = pm.response.json();

      // Lấy các thông tin từ response
      const token = res?.data?.accessToken;
      const tokenType = res?.data?.tokenType || "Bearer";
      const userId = res?.data?.user?.id;

      if (token) {
          // Lưu accessToken và tokenType vào environment variable
          pm.environment.set("accessToken", token);
          pm.environment.set("tokenType", tokenType);
          console.log("Token saved:", token);

          // Lưu userId vào environment variable
          if (userId) {
              pm.environment.set("userId", userId);
              console.log("User ID saved:", userId);
          } else {
              console.warn("Không tìm thấy userId trong data.user object");
          }
      } else {
          console.error("Không tìm thấy accessToken trong response");
      }
    language: text/javascript
order: 1000
