$kind: http-request
url: "{{url}}/user-service/api/v1/auth/login"
method: POST
queryParams:
  - key: size
    value: "10"
    disabled: true
  - key: sort
    value: id,asc
    disabled: true
  - key: status
    value: IN_PROGRESS
    disabled: true
  - key: keyword
    value: keyword
    disabled: true
body:
  type: json
  content: "{\r

    \  \"email\": \"{{email}}\",\r

    \  \"password\": \"{{password}}\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      // Parse response JSON
      const res = pm.response.json();

      const token = res?.data?.accessToken;
      const tokenType = res?.data?.tokenType || "Bearer";
      const userId = res?.data?.user?.id;

      if (token) {
          pm.environment.set("accessToken", token);
          pm.environment.set("tokenType", tokenType);
          console.log("Token saved");

          if (userId) {
              pm.environment.set("userId", userId);
              console.log("User ID saved:", userId);
          } else {
              console.warn("userId not found in data.user");
          }
      } else {
          console.error("accessToken not found in response");
      }
    language: text/javascript
order: 1000
