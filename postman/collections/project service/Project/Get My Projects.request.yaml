$kind: http-request
url: "{{url}}/project-service/api/v1/projects/me?page=0&size=20"
method: GET
queryParams:
  - key: page
    value: "0"
  - key: size
    value: "20"
  - key: search
    value: ""
    disabled: true
  - key: sortBy
    value: ""
    disabled: true
  - key: sortDirection
    value: ""
    disabled: true
scripts:
  - type: afterResponse
    code: "// 1. Parse dữ liệu JSON từ response trả về\r

      const responseData = pm.response.json();\r

      \r

      // 2. Truy cập vào phần tử đầu tiên trong mảng \"projects\" và lấy \"id\"\r

      const firstProjectId = responseData.data.content[0].id;\r

      \r

      // 3. Lưu project id vào biến môi trường (Environment Variable) của Postman\r

      pm.environment.set(\"projectId\", firstProjectId);"
    language: text/javascript
order: 3000
