$kind: http-request
url: "{{url}}/project-service/api/v1/projects/invitations/me"
method: GET
scripts:
  - type: afterResponse
    code: "// 1. Phân tích cú pháp chuỗi JSON trả về từ API\r

      const responseData = pm.response.json();\r

      \r

      // 2. Trích xuất invitationId từ cấu trúc data.project.id\r

      const invitationId = responseData.data.invitations[0].id;\r

      \r

      // 3. Lưu vào biến môi trường (Khuyên dùng)\r

      pm.environment.set(\"invitationId\", invitationId);\r

      \r

      // In ra console để bạn dễ dàng kiểm tra/debug nếu cần\r

      console.log(\"Đã lưu invitationId thành công:\", invitationId);"
    language: text/javascript
order: 8000
